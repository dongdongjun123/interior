{% extends "layout.html" %}

{% block title %}결 - 회원가입{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 520px;">
  <div class="preview-card bg-white border rounded-4 p-4 p-md-5">
    <h2 class="mb-2">회원가입</h2>
    <p class="text-muted mb-4">디자인 히스토리를 안전하게 보관하세요.</p>

    {% if error %}
      <div class="alert alert-danger" role="alert">{{ error }}</div>
    {% endif %}

    <form method="post" action="{{ url_for('auth.signup', next=next_url) }}">
      <input type="hidden" name="next" value="{{ next_url }}">
      <div class="mb-3">
        <label for="signupEmail" class="form-label">이메일</label>
        <input
          id="signupEmail"
          name="email"
          type="email"
          class="form-control"
          value="{{ request.form.get('email', '') }}"
          autocomplete="email"
          required
        >
      </div>
      <div class="mb-3">
        <label for="signupPassword" class="form-label">비밀번호</label>
        <input
          id="signupPassword"
          name="password"
          type="password"
          class="form-control"
          minlength="6"
          autocomplete="new-password"
          required
        >
        <div class="form-text">6자 이상 입력해 주세요.</div>
      </div>
      <div class="mb-4">
        <label for="signupPasswordConfirm" class="form-label">비밀번호 확인</label>
        <input
          id="signupPasswordConfirm"
          name="password_confirm"
          type="password"
          class="form-control"
          minlength="6"
          autocomplete="new-password"
          required
        >
      </div>
      <button type="submit" class="btn btn-dark rounded-pill px-4 w-100">
        가입하고 시작하기
      </button>
    </form>

    <p class="text-center text-muted small mt-4 mb-0">
      이미 계정이 있나요?
      <a href="{{ url_for('auth.login', next=next_url) }}">로그인</a>
    </p>
  </div>
</div>
{% endblock %}
