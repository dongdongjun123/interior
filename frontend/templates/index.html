{% extends "layout.html" %}

{% block title %}결 - Home{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">
{% endblock %}

{% block content %}
<div class="home-page">
  <section class="hero-section">
    <h1>AI가 만드는<br>나만의 인테리어</h1>
    <p class="lead">
      방 사진 한 장으로 우리집 평면도를 만들고<br>
      원하는 스타일로 인테리어를 완성해보세요.
    </p>

    <div class="hero-image">
      <img
        src="{{ url_for('mood_image', filename='ed1c1ef1400a.jpg') }}"
        alt="따뜻한 원목 가구로 꾸민 밝은 침실"
      >
    </div>

    <a href="{{ url_for('start') }}" class="btn btn-lg btn-hero-start">
      새로운 디자인 시작하기 <span aria-hidden="true">→</span>
    </a>
  </section>
</div>
{% endblock %}
